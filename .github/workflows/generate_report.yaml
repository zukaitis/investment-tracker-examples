---
name: Generate Report
on:
  schedule:
    - cron: '00 9 * * *'  # generate report everyday at 9:00 UTC
  push:
  workflow_dispatch:

jobs:
  generate-report:
    name: Generate Report
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout Upstream Repo
        uses: actions/checkout@v5
        with:
          repository: zukaitis/investment-tracker
          ref: ci-rework
          path: upstream
      - name: Install Python packages
        run: pip3 install -r ./upstream/requirements.txt
      - name: Generate Report
        run: ./upstream/generate_report.py --input_dir .
      - name: Set Environment Variables
        id: env_vars
        run: |
          echo "DATE=$(date -I)" >> $GITHUB_ENV
          echo "TIME=$(date '+%T')" >> $GITHUB_ENV
          echo "TAG=$(date '+%FT%H%M%S')" >> $GITHUB_ENV
          echo "REPORT_NAME=Report_$DATE.html" >> $GITHUB_ENV
      - name: Set Report Name

      - name: Rename Output File
        run: mv report.html $REPORT_NAME
      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.1.0
        with:
            keep_latest: 6  # specify how many old releases you want to keep here
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: $REPORT_NAME
          name: Report $DATE $TIME
          tag_name: $TAG
