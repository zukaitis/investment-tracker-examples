---
name: Generate Report
on:
  schedule:
    - cron: '00 9 * * *'  # generate report everyday at 9:00 UTC
  push:
  workflow_dispatch:

jobs:
  generate-report:
    name: Generate Report
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Checkout Upstream Repo
        uses: actions/checkout@v5
        with:
          repository: zukaitis/investment-tracker
          ref: ci-rework
          path: upstream
      - name: Install Python packages
        run: pip3 install -r ./upstream/requirements.txt
      - name: Generate Report
        run: ./upstream/generate_report.py --input_dir .
      - name: Set Environment Variables
        id: env_var
        run: |
          echo "DATE=$(date -I)" >> $GITHUB_OUTPUT >> $GITHUB_ENV
          echo "TIME=$(date '+%T')" >> $GITHUB_OUTPUT >> $GITHUB_ENV
          echo "TAG=$(date '+%FT%H%M%S')" >> $GITHUB_OUTPUT >> $GITHUB_ENV
          echo "REPORT_NAME=Report_$(date -I).html" >> $GITHUB_OUTPUT >> $GITHUB_ENV
      - name: Rename Output File
        run: mv report.html $REPORT_NAME
      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.1.0
        with:
            keep_latest: 6  # specify how many old releases you want to keep here
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.env_var.outputs.REPORT_NAME }}
          name: Report ${{ steps.env_var.outputs.DATE}} ${{steps.env_var.outputs.TIME }}
          tag_name: ${{ steps.env_var.outputs.TAG }}
